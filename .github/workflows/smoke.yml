name: Seoteuk Mate Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static smoke checks
        run: node tests/smoke.mjs
      - name: JavaScript syntax checks
        shell: bash
        run: |
          for f in ai-providers.js analytics-dashboard.js editor-live-inspector.js evidence-fusion.js firebase-cloud.js local-tools-admissions.js official-2026.js project-writer.js rules-engine.js student-workspace.js teacher-ux.js sw.js; do
            node --check "$f"
          done
      - name: JSON checks
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));"
